name: Tests and Ruff

on: [push, pull_request]

permissions:
  contents: read

jobs:
  mvp-snapshot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: docker build -f sourcehealth/sast/Dockerfile -t sourcehealth-sast .
      - run: python scripts/mvp_snapshot_smoke.py

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/compose_smoke.py --project sourcehealth-smoke-ci
      - name: Cleanup even after cancellation or smoke failure
        if: always()
        run: docker compose --project-name sourcehealth-smoke-ci down -v --remove-orphans

  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-server.lock
      - run: python -m pip install -e ".[dev,server]"
      - run: python -B -m unittest discover -s tests -v
      - run: python -m ruff check .

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sourcehealth
          POSTGRES_PASSWORD: sourcehealth
          POSTGRES_DB: sourcehealth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sourcehealth -d sourcehealth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://sourcehealth:sourcehealth@127.0.0.1:5432/sourcehealth_test
      TEST_DATABASE_URL: postgresql+psycopg://sourcehealth:sourcehealth@127.0.0.1:5432/sourcehealth_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-server.lock
      - run: python -m pip install -e ".[server]"
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m unittest tests.test_integration -v
      - run: docker compose config --quiet

  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-server.lock
      - run: python -m pip install -e ".[server]"
      - run: python scripts/export_openapi.py
      - run: npm ci --prefix frontend
      - run: npm run types --prefix frontend
      - run: git diff --exit-code -- docs/openapi.json frontend/src/api/generated.ts
      - run: npm run build --prefix frontend
