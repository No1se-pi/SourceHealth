name: sourcehealth-prod

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  env_file:
    - path: ../.env.production
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://sourcehealth:${POSTGRES_PASSWORD}@postgres:5432/sourcehealth
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sourcehealth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sourcehealth
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sourcehealth -d sourcehealth"]
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
  migrate:
    <<: *app
    restart: "no"
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    <<: *app
    command: [python, -m, uvicorn, sourcehealth.api.app:create_app, --factory, --host, 0.0.0.0, --port, "8000", --no-access-log]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    <<: *app
    command: [python, -m, sourcehealth.application, worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [backend]

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
